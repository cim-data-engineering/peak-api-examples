[project]
name = "peak-api-examples"
version = "0.1.0"
description = "Python examples for the PEAK platform API"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "polars>=1.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.9"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
